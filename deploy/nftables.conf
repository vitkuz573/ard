#!/usr/sbin/nft -f
#
# ARD gateway firewall. Default deny; only SSH is reachable until the gateway
# registers its own listeners here explicitly.
#
# Never add an adbd port to this file. adbd lives on a device and is reached over
# that device's loopback interface, never from the gateway. A device that has to
# be reachable is reachable as a client of ard-server, not as a listening port.
#
# "destroy table" rather than "flush ruleset": a global flush would also delete the
# table fail2ban maintains for its active bans, and fail2ban cannot detect that.
# "destroy" is a no-op when the table is absent, so this file stays idempotent
# across repeated applications and boots.
#
# Requires nft >= 1.0.9 for "destroy". Debian 13 ships 1.1.3.

destroy table inet ard

table inet ard {
    set admin_ports {
        type inet_service
        elements = { 22 }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        # ICMP is not optional: without path MTU discovery the symptom is a hung
        # TLS handshake rather than a routing error, which is far harder to read.
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        tcp dport @admin_ports accept

        limit rate 5/minute burst 10 packets log prefix "ard-firewall-drop " level info
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}